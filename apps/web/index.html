    <script>
      // Apply the saved (or system) theme before first paint so light-mode users don't see a dark flash.
      try {
        var saved = localStorage.getItem('riftrades-theme-mode');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'light' || (!saved && !prefersDark)) document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <meta name="description" content="RiftTrades - Trade Balancer for Riftbound TCG" />
    <meta name='impact-site-verification' value='508a1028-f1ff-4dac-95a2-2addb022acf7'>
    <title>RiftTrades</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Netlify Forms: static markup so the deploy bot can register the form.
         The interactive UI lives in /support (React); submissions POST here. -->
    <form name="support" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
