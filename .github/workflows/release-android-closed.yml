name: Release Android (Play Closed Testing)

# Releases are cut from one tag, `mobile-v1.0.0`, which triggers this workflow and
# the Codemagic iOS workflow from the same commit. Before that, iOS shipped from a
# Codemagic UI button and Android from a manual dispatch, so the two stores could
# carry different code under the same version string.
#
# workflow_dispatch stays for builds that are not releases: a one-off staging
# bundle, or a rebuild of a track after a failed upload.
on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      track:
        description: >
          Play Console track name. Built-in tracks: internal, alpha, beta.
          Custom closed tracks use the exact name shown in Play Console
          (Testing → Closed testing).
        required: true
        default: alpha
        type: string
      status:
        description: Release status on the track
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
      build_name:
        description: Optional versionName override (e.g. 1.0.2). Leave blank to use pubspec.yaml.
        required: false
        type: string
      build_number:
        description: >
          Optional versionCode override. Leave blank to auto-increment from the
          highest versionCode already uploaded to Play (recommended).
        required: false
        type: string
      environment:
        description: >
          Which Supabase project the build talks to (apps/mobile/env/*.json).
          Use staging for anything exercising sandbox purchases.
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: release-android-closed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    # `inputs` is empty on a tag push, so each of these falls back to what a real
    # release is: the closed track, live, against production.
    env:
      RELEASE_TRACK: ${{ inputs.track || 'alpha' }}
      RELEASE_STATUS: ${{ inputs.status || 'completed' }}
      APP_ENVIRONMENT: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # First, before twenty minutes of Gradle: Play takes whatever versionName it is
      # handed, so a tag that disagrees with pubspec.yaml ships silently.
      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-release-tag.sh "${{ github.ref }}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p apps/mobile/android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/upload-keystore.jks

      - name: Write key.properties
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing ANDROID_KEYSTORE_PASSWORD and/or ANDROID_KEY_PASSWORD secrets"
            exit 1
          fi
          alias="${ANDROID_KEY_ALIAS:-upload}"
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$alias"
            printf 'storeFile=%s\n' 'app/upload-keystore.jks'
          } > apps/mobile/android/key.properties

      # GitHub-hosted runners have ~7GB RAM; cap Gradle if the project asks for more.
      - name: Cap Gradle memory for CI
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f apps/mobile/android/gradle.properties ]; then
            if grep -q '^org.gradle.jvmargs=' apps/mobile/android/gradle.properties; then
              sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError/' \
                apps/mobile/android/gradle.properties
            else
              echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError' \
                >> apps/mobile/android/gradle.properties
            fi
          fi

      # Play rejects reuse of any previously uploaded versionCode. Query Play for the
      # max across bundles/APKs and use max+1 unless a manual override is provided.
      - name: Resolve version code
        id: version
        working-directory: ${{ github.workspace }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.rifttrades.myapp
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: |
          if [ -n "$BUILD_NUMBER_OVERRIDE" ]; then
            echo "version_code=$BUILD_NUMBER_OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using manual versionCode override: $BUILD_NUMBER_OVERRIDE"
            exit 0
          fi

          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          python3 -m pip install --quiet google-api-python-client google-auth
          python3 <<'PY'
          import json
          import os

          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          package = os.environ["PACKAGE_NAME"]
          info = json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          service = build(
              "androidpublisher", "v3", credentials=creds, cache_discovery=False
          )
          edit_id = service.edits().insert(packageName=package, body={}).execute()["id"]
          try:
              bundles = (
                  service.edits()
                  .bundles()
                  .list(packageName=package, editId=edit_id)
                  .execute()
              )
              apks = (
                  service.edits()
                  .apks()
                  .list(packageName=package, editId=edit_id)
                  .execute()
              )
              codes = [b["versionCode"] for b in bundles.get("bundles", [])]
              codes += [a["versionCode"] for a in apks.get("apks", [])]
              next_code = (max(codes) if codes else 0) + 1
          finally:
              service.edits().delete(packageName=package, editId=edit_id).execute()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_code={next_code}\n")
          print(f"Auto-incremented versionCode from Play: {next_code}")
          PY

      - name: Guard Supabase env file
        run: grep -q '"SUPABASE_URL": *"http' "env/${APP_ENVIRONMENT}.json"

      - name: Build app bundle
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.version_code }}
        run: |
          if [ -z "$BUILD_NUMBER" ]; then
            echo "Resolved versionCode is empty"
            exit 1
          fi
          args=(
            build appbundle --release
            --build-number="$BUILD_NUMBER"
            --dart-define-from-file="env/${APP_ENVIRONMENT}.json"
          )
          if [ -n "$BUILD_NAME" ]; then
            args+=(--build-name="$BUILD_NAME")
          fi
          echo "Building $APP_ENVIRONMENT with versionCode=$BUILD_NUMBER${BUILD_NAME:+ versionName=$BUILD_NAME}"
          flutter "${args[@]}"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rifttrades.myapp
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ env.RELEASE_TRACK }}
          status: ${{ env.RELEASE_STATUS }}
